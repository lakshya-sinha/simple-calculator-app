<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="cursor"></div>
    <main>
        <div class="container">
            <input type="text" id="input">
            <div class="num-layout">
                <button id="ac" class="brown">AC</button>
                <button id="delete" class="brown">DEL</button>
                <button id="percentage" class="brown">%</button>
                <button id="hyfun" class="yellow">/</button>
                <button id="7">7</button>
                <button id="8">8</button>
                <button id="9">9</button>
                <button id="star" class="yellow">*</button>
                <button id="4">4</button>
                <button id="5">5</button>
                <button id="6">6</button>
                <button id="minus" class="yellow">-</button>
                <button id="1">1</button>
                <button id="2">2</button>
                <button id="3">3</button>
                <button id="plus" class="yellow">+</button>
                <button id="zero">0</button>
                <button id="dot">.</button>
                <button id="equal" class="yellow">=</button>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
